[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core>=2"]

[tool.poetry]
name = "returns"
version = "0.29.0"
description = "Make your functions return something meaningful, typed, and safe!"
license = "BSD-3-Clause"

authors = [
  "sobolevn <mail@sobolevn.me>",
]

readme = "README.md"

repository = "https://github.com/dry-python/returns"
homepage = "https://returns.readthedocs.io"

keywords = [
  "functional programming",
  "fp",
  "monads",
  "monad",
  "monad transformers",
  "composition",
  "type-safety",
  "mypy",
  "railway-oriented-programming",
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Framework :: Hypothesis",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
  "Typing :: Typed",
]

[tool.poetry.urls]
Funding = "https://github.com/sponsors/dry-python"

[tool.poetry.plugins.hypothesis]
_ = "returns.contrib.hypothesis._entrypoint:_setup_hook"

[tool.poetry.plugins.pytest11]
returns = "returns.contrib.pytest.plugin"

[tool.poetry.dependencies]
python = "^3.11"
typing-extensions = ">=4.0,<5.0"
pytest = {version = ">=8,<10", optional = true}
hypothesis = {version = "^6.151", optional = true}
mypy = {version = ">=1.19,<2.4", optional = true}

[tool.poetry.extras]
compatible-mypy = ["mypy"]
check-laws = ["pytest", "hypothesis"]

[tool.poetry.group.dev.dependencies]
anyio = "^4.3"
trio = "^0.33"
attrs = "^26.1"
httpx = "^0.28"
wemake-python-styleguide = "^1.7"
slotscheck = "^0.20"
ruff = "^0.16"
pytest-cov = "^7.1"
pytest-randomly = "^4.1"
pytest-mypy-plugins = "^4.0"
pytest-subtests = "^0.15"
pytest-shard = "^0.1"
pytest-codspeed = "^5.0"
covdefaults = "^2.3"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
sphinx = "^9.0"
sphinx-autodoc-typehints = "^3.6"
sphinxcontrib-mermaid = "^2.1"
furo = "^2025.12"
myst-parser = "^5.1"


[tool.ruff]
# Ruff config: https://docs.astral.sh/ruff/settings
preview = true
fix = true
output-prefer-rule-codes = true
target-version = "py311"
line-length = 80

[tool.ruff.format]
quote-style = "single"
docstring-code-format = false

[tool.ruff.lint]
select = [
  "A",    # flake8-builtins
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "C90",  # maccabe
  "COM",  # flake8-commas
  "D",    # pydocstyle
  "DTZ",  # flake8-datetimez
  "E",    # pycodestyle
  "ERA",  # flake8-eradicate
  "EXE",  # flake8-executable
  "F",    # pyflakes
  "FBT",  # flake8-boolean-trap
  "FLY",  # pyflint
  "FURB", # refurb
  "G",    # flake8-logging-format
  "I",    # isort
  "ICN",  # flake8-import-conventions
  "ISC",  # flake8-implicit-str-concat
  "LOG",  # flake8-logging
  "N",    # pep8-naming
  "PERF", # perflint
  "PIE",  # flake8-pie
  "PL",   # pylint
  "PT",   # flake8-pytest-style
  "PTH",  # flake8-use-pathlib
  "PYI",  # flake8-pyi
  "Q",    # flake8-quotes
  "RET",  # flake8-return
  "RSE",  # flake8-raise
  "RUF",  # ruff
  "S",    # flake8-bandit
  "SIM",  # flake8-simpify
  "SLF",  # flake8-self
  "SLOT", # flake8-slots
  "T100", # flake8-debugger
  "TRY",  # tryceratops
  "UP",   # pyupgrade
  "W",    # pycodestyle
  "YTT",  # flake8-2020
]
ignore = [
  "A005",    # allow to shadow stdlib and builtin module names
  "COM812",  # trailing comma, conflicts with `ruff format`
  # Different doc rules that we don't really care about:
  "D100",
  "D104",
  "D106",
  "D203",
  "D212",
  "D401",
  "D404",
  "D405",
  "D421",    # property docstrings can start with a verb
  "ISC001",  # implicit string concat conflicts with `ruff format`
  "ISC003",  # prefer explicit string concat over implicit concat
  "PLR09",   # we have our own complexity rules
  "PLR2004", # do not report magic numbers
  "PLR6301", # do not require classmethod / staticmethod when self not used
  "RUF105",  # keep old `# noqa` comments style, not `# ruff` comments
  "RUF106",  # we prefer old error codes
  "RUF201",  # keep old rule codes instead of verbose names
  "TRY003",  # long exception messages from `tryceratops`
]
external = ["WPS"]

# Plugin configs:
flake8-quotes.inline-quotes = "single"
mccabe.max-complexity = 6
pep8-naming.staticmethod-decorators = ["law_definition", "staticmethod"]
pydocstyle.convention = "google"

[tool.ruff.lint.per-file-ignores]
"*.pyi" = ["D103"]
"benchmarks/*.py" = [
  "S101",   # asserts
]
"returns/context/__init__.py" = ["F401", "PLC0414"]
"returns/contrib/mypy/*.py" = ["S101"]
"returns/contrib/mypy/_typeops/visitor.py" = ["S101"]
"returns/contrib/pytest/__init__.py" = ["F401", "PLC0414"]
"returns/interfaces/*.py" = ["S101"]
"returns/methods/__init__.py" = ["F401", "PLC0414"]
"returns/pipeline.py" = ["F401", "PLC0414"]
"returns/pointfree/__init__.py" = ["F401", "PLC0414"]
"returns/primitives/asserts.py" = ["S101"]
"tests/*.py" = [
  "RUF029", # allow async functions to not use `await`
  "S101",   # asserts
  "S105",   # hardcoded passwords
  "S404",   # subprocess calls are for tests
  "S603",   # do not require `shell=True`
  "S607",   # partial executable paths
]
"tests/test_examples/*" = ["D102"]
"tests/test_examples/test_maybe/test_maybe_pattern_matching.py" = [
  "D101",
  "D103",
  "F811",
]
"tests/test_examples/test_result/test_result_pattern_matching.py" = [
  "D103",
]
"tests/test_pattern_matching.py" = ["S101"]


[tool.slotscheck]
strict-imports = true
require-subclass = true
require-superclass = true
exclude-modules = "returns\\.contrib\\."
exclude-classes = "returns\\.primitives\\.exceptions:UnwrapFailedError"


[tool.codespell]
# codespell configuration: https://pypi.org/project/codespell
ignore-words-list = ["appliable", "falsy"]
skip = ["__pycache__", "_build", ".mypy_cache"]


[tool.typos]
# typos configuration: https://github.com/crate-ci/typos/
default.extend-ignore-identifiers-re = ["bimap"]
files.extend-exclude = [
  "__pycache__",
  "_build",
  ".mypy_cache",
  "*.lock",
]
