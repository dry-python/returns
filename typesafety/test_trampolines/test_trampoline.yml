- case: trampoline_missing_args
  disable_cache: false
  main: |
    from typing import List, Union
    from returns.trampolines import Trampoline, trampoline

    @trampoline
    def _accumulate(
        numbers: list[int],
        acc: int = 0,
    ) -> int | Trampoline[int]:
        return Trampoline(_accumulate)
  out: |
    main:9: error: Missing positional argument "numbers" in call to "Trampoline"  [call-arg]


- case: trampoline_wrong_args
  disable_cache: false
  main: |
    from typing import List, Union
    from returns.trampolines import Trampoline, trampoline

    @trampoline
    def _accumulate(
        numbers: list[int],
        acc: int = 0,
    ) -> int | Trampoline[int]:
        return Trampoline(_accumulate, ['a'], 'b')
  out: |
    main:9: error: List item 0 has incompatible type "str"; expected "int"  [list-item]
    main:9: error: Argument 3 to "Trampoline" has incompatible type "str"; expected "int"  [arg-type]


- case: trampoline_return_type
  disable_cache: false
  main: |
    from typing import List, Union
    from returns.trampolines import Trampoline, trampoline

    @trampoline
    def _accumulate(
        numbers: list[int],
        acc: int = 0,
    ) -> int | Trampoline[int]:
        return Trampoline(_accumulate, [1], 2)

    reveal_type(_accumulate([1, 2]))  # N: Revealed type is "int"


- case: trampoline_attributes
  disable_cache: false
  main: |
    from returns.trampolines import Trampoline

    def test(t: Trampoline[int]) -> None:
        reveal_type(t.func)  # N: Revealed type is "def (*Any, **Any) -> int"
        reveal_type(t.args)  # N: Revealed type is "tuple[Any, ...]"
        reveal_type(t.kwargs)  # N: Revealed type is "dict[str, Any]"


- case: trampoline_correct_cast
  disable_cache: false
  main: |
