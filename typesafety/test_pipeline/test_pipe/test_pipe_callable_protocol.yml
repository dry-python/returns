- case: pipe_invalid_intermediate_callable_assignment
  disable_cache: true
  main: |
    from collections.abc import Callable
    from returns.pipeline import pipe

    def load(value: str) -> str:
        return value

    def compute(value: int) -> int:
        return value - 1

    def display(value: int) -> str:
        return str(value)

    pipeline: Callable[[str], str] = pipe(load, compute, display)
  out: |
    main:13: error: Argument 1 to "compute" has incompatible type "str"; expected "int"  [arg-type]


- case: pipe_invalid_intermediate_callable_argument
  disable_cache: true
  main: |
    from collections.abc import Callable
    from returns.pipeline import pipe

    def load(value: str) -> str:
        return value

    def compute(value: int) -> int:
        return value - 1

    def display(value: int) -> str:
